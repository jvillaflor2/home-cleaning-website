<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo-group">
                <img src="images/logo-2-icon.webp" alt="Housekeeping and Laundry Logo" class="logo">
                <span class="logo-text">Housekeeping &amp; Laundry</span>
            </a>
            <a href="index.html#services">Services</a>
            <a href="index.html#pricing">Pricing</a>
            <a href="booking.html">Contact</a>
        </nav>

    </header>

    <section class ="booking-page">
        <h1>Request a free quote today</h1>
        <p>Fill out the form below and we'll get back to you shortly.</p>

        <form action="/booking" method="POST" class="booking-form">
            <input type="text" name="name" placeholder="Your name" required>
            <input type="email" name="email" placeholder="Your email" required>
            <input type="text" name="address" placeholder="Address" required>
            <input type="date" name="preferredDate" required>
            <button type="submit" class="btn">Request a quote</button>
        </form>
    </section>
       <footer class="site-footer">
            <div class="footer content">
                 <img src="images/logo-2-icon.webp" alt="Housekeeping and Laundry logo" class="footer-logo">
                <p class="footer-brand">Housekeeping &amp; Laundry</p>
                <p>Serving Edmonton and surrounding areas</p>
                <p>&copy; 2026 All rights reserved.</p>
            </div>
        </footer>
</body>
</html>
